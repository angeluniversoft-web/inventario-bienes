name: Construir APK (Android)

# Se dispara al subir a la raíz del repositorio un archivo proyecto-apk*.zip
# (el zip se sube SIN descomprimir; aquí se descomprime y se compila).
# v2: sin acciones de terceros para el SDK y Gradle (el runner ya trae el SDK de Android).
on:
  push:
    paths:
      - 'proyecto-apk*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      GRADLE_VERSION: '8.7'
    steps:
      - name: 1 · Obtener repositorio
        uses: actions/checkout@v5

      - name: 2 · Descomprimir proyecto
        run: |
          set -e
          echo "Archivos en la raíz:"; ls -la
          ZIP=$(ls proyecto-apk*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$ZIP" ]; then echo "::error::No hay ningún proyecto-apk*.zip en la raíz del repositorio"; exit 1; fi
          echo "Usando $ZIP"
          rm -rf build-src && mkdir build-src
          unzip -q "$ZIP" -d build-src
          SETTINGS=$(find build-src -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "::error::El zip no contiene settings.gradle"; find build-src | head -50; exit 1; fi
          PROJ="$GITHUB_WORKSPACE/$(dirname "$SETTINGS")"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Proyecto en $PROJ"
          ls "$PROJ/app/src/main/assets/www"

      - name: 3 · Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 4 · SDK de Android (preinstalado en el runner)
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK: $SDK"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then echo "::error::El runner no tiene SDK de Android"; exit 1; fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$SDK" > "$PROJ/local.properties"

      - name: 5 · Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -e
          curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: 6 · Compilar APK firmado
        run: |
          set -e
          cd "$PROJ"
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/InventarioBienes.apk"
          ls -la "$GITHUB_WORKSPACE/InventarioBienes.apk"

      - name: 7 · Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: InventarioBienes-apk
          path: InventarioBienes.apk

      - name: 8 · Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Inventario de Bienes · Android v${{ github.run_number }}
          body: |
            APK firmado con la firma fija del proyecto (se instala encima de la versión anterior sin perder datos).
            Descargue **InventarioBienes.apk** en el celular y ábralo para instalar.
          files: InventarioBienes.apk
